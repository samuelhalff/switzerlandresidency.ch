name: AI guides (every 3 days)

# Generates one new guide (EN + FR + DE) from content/backlog.json, runs the guardrails and the
# build, commits to main (which triggers "Build and deploy") and, once the site is indexable,
# pings the sitemap and IndexNow. See README → "Automated guides". Pause: disable this workflow.

on:
  schedule:
    - cron: "0 5 */3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the chosen topic and outline, write and commit nothing"
        type: boolean
        default: false
      slug:
        description: "Optional backlog slug to generate instead of the automatic pick"
        type: string
        required: false

concurrency:
  group: ai-articles
  cancel-in-progress: false

permissions:
  contents: write # commit the new guide
  actions: write # dispatch deploy.yml when pushing with GITHUB_TOKEN

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_PAT: ${{ secrets.PAT_TOKEN != '' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://switzerlandresidency.ch' }}
      NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX || 'true' }}
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ARTICLE_STATE: ${{ github.workspace }}/../ai-article-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          # A PAT push triggers deploy.yml by itself; GITHUB_TOKEN pushes do not (handled below).
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate guide (Azure OpenAI)
        id: gen
        timeout-minutes: 32
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_TRANSLATE_DEPLOYMENT: ${{ vars.AZURE_OPENAI_TRANSLATE_DEPLOYMENT }}
          AZURE_OPENAI_RESEARCH_ENDPOINT: ${{ secrets.AZURE_OPENAI_RESEARCH_ENDPOINT }}
          AZURE_OPENAI_RESEARCH_API_KEY: ${{ secrets.AZURE_OPENAI_RESEARCH_API_KEY }}
          AZURE_OPENAI_RESEARCH_DEPLOYMENT: ${{ vars.AZURE_OPENAI_RESEARCH_DEPLOYMENT }}
          AZURE_OPENAI_RESEARCH_API_VERSION: ${{ vars.AZURE_OPENAI_RESEARCH_API_VERSION }}
          AI_ARTICLE_SLUG: ${{ inputs.slug }}
          MODE: ${{ inputs.dry_run && '--dry-run' || '--apply' }}
        run: timeout -k 30s 30m node scripts/ai-article.mjs "$MODE"

      - name: Guardrails (discard the article on failure)
        if: ${{ !inputs.dry_run && steps.gen.outputs.generated == 'true' }}
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: node scripts/validate-new-article.mjs --slug "$SLUG" --discard-on-fail

      - name: Tests and build
        if: ${{ !inputs.dry_run && steps.gen.outputs.generated == 'true' }}
        run: |
          npm test
          npm run build

      - name: Commit and push to main
        id: push
        if: ${{ !inputs.dry_run && steps.gen.outputs.generated == 'true' }}
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/en/guides/$SLUG.md" "content/fr/guides/$SLUG.md" "content/de/guides/$SLUG.md" content/backlog.json
          git commit -m "content(guides): $TITLE (EN/FR/DE)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 15))
          done
          exit 1

      - name: Trigger deploy (GITHUB_TOKEN pushes do not start workflows)
        if: ${{ steps.push.outputs.pushed == 'true' && env.HAS_PAT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Wait for the new guide to go live
        id: live
        if: ${{ steps.push.outputs.pushed == 'true' && env.NEXT_PUBLIC_NOINDEX != 'true' }}
        continue-on-error: true
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          url="$NEXT_PUBLIC_SITE_URL/en/guides/$SLUG/"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then echo "live after $i checks"; exit 0; fi
            sleep 40
          done
          echo "::warning::$url not live after 20 minutes; pinging anyway"

      - name: Ping sitemap
        if: ${{ steps.push.outputs.pushed == 'true' && env.NEXT_PUBLIC_NOINDEX != 'true' }}
        continue-on-error: true
        run: timeout -k 10s 2m node scripts/ping-sitemaps.mjs

      - name: Submit to IndexNow
        if: ${{ steps.push.outputs.pushed == 'true' && env.NEXT_PUBLIC_NOINDEX != 'true' }}
        continue-on-error: true
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: timeout -k 10s 2m node scripts/indexnow.mjs --slug "$SLUG"
